[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modem15rol-longctx_jd246"
version = "0.1.0"
description = "从输入中抽取数值，计算长上下文优化工程师·向量索引的召回与构建代价相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "modem15rol" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://modem15rol.github.io"
Repository = "https://github.com/modem15rol/longctx_jd246"
Issues = "https://github.com/modem15rol/longctx_jd246/issues"

[project.scripts]
longctx_jd246 = "longctx_jd246:main"

[tool.setuptools]
py-modules = ["longctx_jd246"]
